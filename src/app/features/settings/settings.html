<main id="main-content" class="page">
  <app-page-header title="Settings" />

  <fieldset class="group">
    <legend>Theme</legend>
    <div class="choices">
      @for (c of themes; track c.value) {
        <label class="choice">
          <input
            type="radio"
            name="theme"
            [value]="c.value"
            [checked]="settings().theme === c.value"
            (change)="set('theme', c.value)"
          />
          <span class="key choice__cap">{{ c.label }}</span>
        </label>
      }
    </div>
  </fieldset>

  <fieldset class="group" aria-describedby="motion-hint">
    <legend>Motion</legend>
    <p class="group__hint" id="motion-hint">
      Reduced turns off the shake, the confetti and the floating points.
    </p>
    <div class="choices">
      @for (c of motions; track c.value) {
        <label class="choice">
          <input
            type="radio"
            name="motion"
            [value]="c.value"
            [checked]="settings().motion === c.value"
            (change)="set('motion', c.value)"
          />
          <span class="key choice__cap">{{ c.label }}</span>
        </label>
      }
    </div>
  </fieldset>

  <div class="group">
    <label class="toggle">
      <input
        type="checkbox"
        role="switch"
        [checked]="settings().sound"
        (change)="set('sound', $any($event.target).checked)"
      />
      <span class="toggle__text">
        <span class="toggle__label">Sound</span>
        <span class="group__hint">Every correct letter plays the next note of a tune.</span>
      </span>
      <span class="toggle__track" aria-hidden="true"></span>
    </label>
  </div>

  <div class="group">
    <h2 class="group__title">Your data</h2>
    <p class="group__hint">
      Scores and settings live in this browser only. Clearing scores keeps your settings.
    </p>
    <button type="button" class="key reset" (click)="reset()">
      {{ confirmingReset() ? 'Press again to clear every score' : 'Clear scores' }}
    </button>
    <p role="status" class="group__hint">{{ resetDone() ? 'Scores cleared.' : '' }}</p>
  </div>
</main>
