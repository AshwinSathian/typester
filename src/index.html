<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Typester, a typing game</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="A typing game where every word buys time. Build a combo, beat your best, play the Daily."
    />
    <link rel="canonical" href="https://typester.ashwinsathian.com/" />
    <meta name="theme-color" content="#e7e8f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15162a" media="(prefers-color-scheme: dark)" />
    <link
      rel="preload"
      href="/fonts/recursive-casl.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Typester" />
    <meta property="og:title" content="Typester, a typing game" />
    <meta
      property="og:description"
      content="A typing game where every word buys time. Build a combo, beat your best, play the Daily."
    />
    <meta property="og:url" content="https://typester.ashwinsathian.com/" />
    <meta property="og:image" content="https://typester.ashwinsathian.com/icons/icon-512x512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Typester, a typing game" />
    <meta
      name="twitter:description"
      content="A typing game where every word buys time. Build a combo, beat your best, play the Daily."
    />
    <meta
      name="twitter:image"
      content="https://typester.ashwinsathian.com/icons/icon-512x512.png"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Typester",
        "url": "https://typester.ashwinsathian.com/",
        "description": "A typing game where every word buys time. Build a combo, beat your best, play the Daily.",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <!-- Apply saved theme and motion before first paint, so a dark-mode
         player never sees a flash of the light theme. -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('typester') || '{}').settings || {};
        var r = document.documentElement;
        if (s.theme === 'light' || s.theme === 'dark') r.setAttribute('data-theme', s.theme);
        if (s.motion === 'full' || s.motion === 'reduced') r.setAttribute('data-motion', s.motion);
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to play Typester.</noscript>
  </body>
</html>
